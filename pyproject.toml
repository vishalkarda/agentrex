[project]
name = "agentrex"
version = "0.1.0"
description = "Multi-agent research paper analysis system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "arxiv>=2.2.0",
    "fastapi>=0.115.0",
    "langchain-mcp-adapters>=0.2.2",
    "langgraph>=0.2.45",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"
